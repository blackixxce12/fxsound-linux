# Gate -42 dB is the researched value, not the -55 the first draft re-voiced it to. The
# re-voicing assumed RNNoise would be on here; it is not, and a threshold aimed at a denoised
# floor is a dead gate on an undenoised one.
name = "Streaming"
description = "A live send to Twitch, YouTube or Kick: dense and bright, at the level a phone speaker needs."
rnnoise = false
highpass_hz = 100.0
highpass_order = 2
makeup_db = 9.0
ceiling_db = -3.0

[gate]
threshold_db = -42.0
ratio = 2.0
range_db = -14.0
attack_ms = 5.0
release_ms = 180.0
hold_ms = 250.0
detection = "rms"

[compressor]
threshold_db = -20.0
ratio = 4.0
knee_db = 6.0
attack_ms = 15.0
release_ms = 150.0
detection = "rms"

[deesser]
frequency_hz = 5500.0
threshold_db = -25.0

[eq]
centers_hz = [62.5, 115.734, 214.311, 396.85, 734.867, 1360.79, 2519.84, 4666.12, 8640.48, 16000.0]
gains_db = [0, 0, -1, -2, -0.5, 0, 2, 0.5, 0, -1]
