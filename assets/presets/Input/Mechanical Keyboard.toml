# Clicky transients rather than a steady floor, which is the opposite problem from Noisy Room
# and needs the opposite gate. A key click is a millisecond of energy that an RMS detector
# with a ten-millisecond window barely sees and a 150 ms release lets ring: so peak detection,
# a 1 ms attack, a 60 ms release and a 40 ms hold, at 4:1 with a -24 dB range — closed between
# words, and closed *fast*, because the click arrives between them. The denoiser is Strong and
# Independent: the network is good at transients it has seen, keyboards are among them, and a
# stereo capture keeps its own sides because a desk microphone's image is worth having. The
# voice probability holds the gate open through a sentence so the fast release does not chop
# the ends of words. Second-order at 100 Hz rather than fourth: there is no proximity lift to
# take down at desk distance, and a steeper corner buys nothing against a click.
name = "Mechanical Keyboard"
description = "A desk microphone beside a clicky keyboard: a fast peak gate between words, the denoiser at full strength."
rnnoise = true
highpass_hz = 100.0
highpass_order = 2
makeup_db = 5.0
ceiling_db = -3.0
vad_gate = true

[denoise]
level = "strong"
channels = "independent"

[gate]
threshold_db = -38.0
ratio = 4.0
range_db = -24.0
attack_ms = 1.0
release_ms = 60.0
hold_ms = 40.0
detection = "peak"

[compressor]
threshold_db = -20.0
ratio = 3.0
knee_db = 6.0
attack_ms = 5.0
release_ms = 100.0
detection = "rms"

[deesser]
frequency_hz = 5500.0
threshold_db = -22.0

[eq]
centers_hz = [62.5, 115.734, 214.311, 396.85, 734.867, 1360.79, 2519.84, 4666.12, 8640.48, 16000.0]
gains_db = [0, 0, 0, 0, 0, 0, 2.0, 0, 0, 0]
