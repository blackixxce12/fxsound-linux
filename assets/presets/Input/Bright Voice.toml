# The lift is spread over bands 5, 6 and 7 rather than stacked on 6 and 7. Three adjacent
# lifts at the derived Q of about 1.6 sum past what any of them asks for; spread, the realised
# curve is what the preset claims and the air band stops feeding the de-esser's detector.
name = "Bright Voice"
description = "For a dull or chesty voice: presence and air lifted, the low end eased."
rnnoise = false
highpass_hz = 90.0
highpass_order = 2
makeup_db = 5.0
ceiling_db = -3.0

[gate]
threshold_db = -45.0
ratio = 2.0
range_db = -14.0
attack_ms = 5.0
release_ms = 150.0
hold_ms = 200.0
detection = "rms"

[compressor]
threshold_db = -18.0
ratio = 3.0
knee_db = 6.0
attack_ms = 20.0
release_ms = 150.0
detection = "rms"

[deesser]
frequency_hz = 5500.0
threshold_db = -24.0

[eq]
centers_hz = [62.5, 115.734, 214.311, 396.85, 734.867, 1360.79, 2519.84, 4666.12, 8640.48, 16000.0]
gains_db = [0, -1.5, -1, -0.5, 0, 1.5, 1.0, 0.5, 0, 0]
