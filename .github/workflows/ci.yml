name: CI

on:
  push:
    # release/** as well: the packages matrix has to have run on a release branch before the
    # branch is tagged, because the tag is the wrong moment to learn that a leg is broken.
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

# Read-only by default; the one job that needs more says so itself.
permissions:
  contents: read

# A push on top of a push cancels the older run: the older result would be stale before it
# arrived. The group name is distinct from packages.yml's on purpose — a called workflow that
# shares its caller's group waits on itself for ever.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A build failure should not be buried under a thousand lines of dependency output.
  CARGO_NET_RETRY: 3
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lint and test
    # Pinned rather than ubuntu-latest: 24.04's PipeWire 1.0.5 is the oldest the tests run against,
    # and it is where a real bug showed (a new pair took 1.0's startup volume for the user's).
    # ubuntu-latest moves to a newer release, and with it to a newer PipeWire, in October 2026.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      # The build needs far less than the runtime does. `libpipewire-0.3-dev` is for the headers
      # pipewire-sys binds, and `libclang-dev` because it runs bindgen to do it — without it the
      # build fails with "Unable to find libclang", which is the same hole the PKGBUILD had.
      # Deliberately NOT installed: libwayland-dev, libxkbcommon-dev, libgl-dev. None is needed to
      # compile, and adding them would hide the fact that the binary loads them at run time.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libpipewire-0.3-dev libclang-dev \
            pipewire pipewire-bin libspa-0.2-modules \
            libspa-0.2-bluetooth dbus-daemon
          # `pipewire` itself is the daemon, and it is here for the graph-churn tests: each one
          # starts a private server with its own socket and synthetic devices. Without the binary
          # those tests print that they are skipping and pass, which is the right behaviour for a
          # contributor's laptop and the wrong one for CI — so the test steps below set
          # FXSOUND_REQUIRE_PIPEWIRE_TOOLS, which turns every such skip into a failure.
          # `pipewire-bin` is where Ubuntu ships pw-dump, pw-metadata, pw-cli and pw-link (and the
          # daemon binary itself), which the same tests use to see our nodes and defaults from
          # outside the engine and to wire a tone through both lanes; `libspa-0.2-modules` has the
          # `audiotestsrc` plugin that tone comes from. Both already arrive as dependencies of
          # `pipewire`; they are named because the tests now fail without them, and the list here
          # is where to look first when one does. `dbus-daemon` is there for the same reason as
          # `pipewire`: the D-Bus service's tests start a `dbus-daemon` of their own, never the
          # session's. `libspa-0.2-bluetooth` and `dbus-daemon` are also for the tests of a headset
          # between profiles: the only card — PipeWire `Device` — a private daemon can make without
          # hardware is Bluetooth's enumerator, on a private system bus.

      # rust-toolchain.toml pins 1.98.1 and asks for rustfmt and clippy, so rustup installs
      # exactly what the developers use rather than whatever the runner image happens to ship.
      - name: Show the toolchain
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The runner has an XDG_RUNTIME_DIR but no session bus and no session PipeWire in it, and
      # nothing in the suite may reach for any of them: a test that needs the user's session is a
      # test that would take a developer's default device away mid-run. The graph-churn tests in
      # fxsound-audio still talk to a real server — each starts its own private pipewire, with its
      # own runtime directory and socket, from the packages installed above, and kills it when it
      # is done. So never start a daemon in this step; if a test fails for want of one, it should
      # start its own the way those do, through `fxsound_core::test_support`, whose children die
      # with the test process even when a timeout kills it (util-linux's `setpriv --pdeathsig`, or
      # a watchdog where there is none) and whose scratch directories go with the test.
      #
      # FXSOUND_REQUIRE_PIPEWIRE_TOOLS=1 makes every place those tests would print SKIPPED fail
      # instead. The harness hides a passing test's output, so here a skip would be invisible, and
      # with everything installed a skip means something that should work did not. A test that
      # passes having checked less on an older PipeWire says so past the harness, as a warning of
      # this run (`graph_churn::note`).
      - name: Tests
        run: cargo test --workspace
        env:
          FXSOUND_REQUIRE_PIPEWIRE_TOOLS: "1"

      # Release as well: the DSP is full of arithmetic whose rounding differs between opt-levels,
      # and `panic = "abort"` only applies to the release profile.
      - name: Tests, release profile
        run: cargo test --release --workspace
        env:
          FXSOUND_REQUIRE_PIPEWIRE_TOOLS: "1"

      - name: Build
        run: cargo build --release --bin fxsound

  # The same tests on the newest PipeWire and on WirePlumber 0.5, which the job above cannot have:
  # Ubuntu 24.04 ships WirePlumber 0.4.17, and the tests of what only WirePlumber's own policy shows
  # (crates/fxsound-audio/src/graph_churn/policy.rs) need 0.5's profiles, so there they say SKIPPED
  # and pass. Here they have to run: FXSOUND_REQUIRE_WIREPLUMBER=1 turns that skip into a failure,
  # as FXSOUND_REQUIRE_PIPEWIRE_TOOLS=1 does every other. Formatting and lints stay with the job
  # above; this one is about the runtime the tests talk to, so it only tests.
  test-arch:
    name: Test on Arch Linux (newest PipeWire, WirePlumber 0.5)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: archlinux:latest
    env:
      # What the Ubuntu runner has; the image sets no locale at all.
      LANG: C.UTF-8
    steps:
      # Before the checkout, which needs git in the container to make a .git directory. `pipewire`
      # is the daemon and pw-dump, pw-metadata, pw-cli and pw-link; `libpipewire` the headers and
      # the SPA plugins (audiotestsrc, the null AEC); `pipewire-audio` pw-cat, pw-record and the
      # Bluetooth plugin the tests of a headset between profiles use; `dbus` the dbus-daemon of the
      # private buses; `util-linux` the `setpriv --pdeathsig` that the tests' children die by;
      # `pipewire-pulse` the PulseAudio server a private graph starts for the tests of PulseAudio
      # applications, and `libpulse` the `pacat` and `pactl` they play, record and ask it with.
      # rustup rather than Arch's rust, so that the compiler is rust-toolchain.toml's and
      # RUSTFLAGS=-D warnings means what it means in the job above. The image keeps no manual
      # pages or docs, which nothing here reads.
      - name: Install build and test dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            base-devel clang pkgconf rustup git \
            pipewire libpipewire pipewire-audio pipewire-pulse libpulse wireplumber dbus \
            util-linux
          pipewire --version
          wireplumber --version
          setpriv --version

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The tests run as a user of their own, as they do on the Ubuntu runner: as root, a file
      # made read-only or unreadable to test a refusal is written and read all the same. The user
      # gets an empty runtime directory, as a login on the runner does: the engine refuses to start
      # without one even when it is given a private daemon's socket, and nothing in this container
      # listens in it. No cache: this job is shorter than the one above, so not what a push waits
      # for, and a compiled tree of its own would crowd the others out of the repository's cache.
      - name: A user to run the tests as, and the toolchain
        run: |
          set -euo pipefail
          useradd -m tester
          install -d -m 0700 -o tester -g tester /run/tester
          chown -R tester "$GITHUB_WORKSPACE"
          runuser -u tester -- rustup toolchain install
          runuser -u tester -- rustc --version
          runuser -u tester -- cargo --version

      # As in the job above: no session bus, no session PipeWire; every test that needs a daemon
      # starts a private one and takes it down with it. The click measurements run in the next
      # step instead, one at a time.
      - name: Tests
        run: runuser -u tester -- cargo test --workspace -- --skip graph_churn::clicks::under_a_steady_tone
        env:
          XDG_RUNTIME_DIR: /run/tester
          FXSOUND_REQUIRE_PIPEWIRE_TOOLS: "1"
          FXSOUND_REQUIRE_WIREPLUMBER: "1"

      # A steady tone through FxSound, and the worst click each switch leaves in it
      # (crates/fxsound-audio/src/graph_churn/clicks.rs). One at a time, so that the other tests'
      # daemons do not cause the xruns that would discard its runs. Here it only reports: a shared
      # runner has xruns of its own, and the hard gate of -40 dBFS is the local check of an audio
      # phase. The tables go to the job's summary, and a switch over the soft threshold becomes a
      # warning.
      - name: Click measurements
        run: |
          set -euo pipefail
          runuser -u tester -- env FXSOUND_CLICK_REPORT="$GITHUB_WORKSPACE/target/click-report.txt" \
            cargo test -p fxsound-audio --lib graph_churn::clicks::under_a_steady_tone \
            -- --test-threads=1 --nocapture
        env:
          XDG_RUNTIME_DIR: /run/tester
          FXSOUND_REQUIRE_PIPEWIRE_TOOLS: "1"
          FXSOUND_REQUIRE_WIREPLUMBER: "1"
          FXSOUND_CLICK_GATE: report

      - name: Click report
        if: always()
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/target/click-report.txt"
          if [ ! -s "$report" ]; then
            echo "No click report was written."
            exit 0
          fi
          {
            echo '## Clicks under a steady tone'
            echo
            echo '```text'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          { grep 'WARNING' "$report" || true; } | while IFS= read -r line; do
            echo "::warning title=Click report::$line"
          done

  # The workflows themselves: actionlint checks their syntax, expressions, runner labels and job
  # dependencies, and hands every `run:` script to shellcheck. Shellcheck's warnings and errors
  # fail the job; its style and info notes (quoting advice, backticks in the Markdown the release
  # notes echo) do not. actionlint is the released binary, checked against the SHA-256 GitHub
  # records for the asset, rather than an action or a download script: nothing runs here that
  # this file does not pin.
  workflows:
    name: Workflows lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_OPTS: --severity=warning
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          # Without shellcheck actionlint skips the scripts without a word.
          if ! command -v shellcheck > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck
          fi
          shellcheck --version
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" -color

  # Every package the tree can produce, built inside the distribution it targets, installed
  # there and smoke-tested — see packages.yml. Independent of `check`: a packaging failure and a
  # test failure are different news, and waiting for the tests would only delay the first.
  packages:
    name: Packages
    uses: ./.github/workflows/packages.yml
    permissions:
      contents: read

  # packaging/fxsound.1 is synced with cli.rs and dbus.rs by hand. This refuses the drift on
  # the push that causes it rather than at the tag, where release.yml runs the same script. No
  # toolchain: the script only reads the sources.
  manpage:
    name: Manual page agrees with the code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: packaging/check-manpage.sh

  # «Like FxSound for Windows» at Off leaves the output lane as 0.4.0 left it: every shipped preset,
  # as the application plays it, on 10, 20 and 31 bands, over preset_drift's material, in blocks of
  # 480 to 2048 frames, from a cold start and with a preset, the band count and an effect switched
  # while it plays, identical to a build of v0.4.0 made here by the same toolchain (roadmap 0.5.0
  # §1 A3). Nothing is stored between runs: two machines, or two rustc versions, need not
  # round alike. The engine alone is built, so the job needs no PipeWire; python3 and git are on
  # the runner already, and the tag comes with the full history.
  bitexact:
    name: Output DSP bit for bit against 0.4.0
    runs-on: ubuntu-24.04
    # Three release builds and the comparisons; the harness gives a reference build five minutes
    # to connect, and this bounds everything else.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # rust-toolchain.toml's toolchain, installed here before the script builds v0.4.0 with it.
      - name: Show the toolchain
        run: rustc --version
      - name: Off plays as v0.4.0 (A3)
        run: scripts/windows-parity-bitexact.sh --dir "$RUNNER_TEMP/reference-v0.4.0" v0.4.0
      # «Like FxSound for Windows» = Interface and sound against 3596e99, the engine before the
      # 0.4.0 audit (A1), from a cold start: every shipped preset on 10, 20 and 31 bands with
      # both sets of levels (W1b, W1c). The two presets whose Ambience is stored at 51 are A1's
      # listed exception, held to the Windows C code instead (#39, A2, the unit tests). The
      # switching pass is not gated against 3596e99: the glides every level keeps (#9-#11) change
      # what Dynamic Boost's level estimate and the leveller hear for 20 ms, and their memory
      # carries that past -120 dBFS for seconds (W1d, docs/0.5.0-dsp-inventory.md). A3 gates
      # both passes.
      - name: Interface and sound plays as the engine before the audit (A1, cold)
        env:
          FXSOUND_BITEXACT_PASSES: cold
          FXSOUND_BITEXACT_EXCEPT: BonusPresets/Classic Rock,BonusPresets/R&B
          FXSOUND_BITEXACT_OUT: target/windows-parity-bitexact-a1.tsv
        run: >-
          scripts/windows-parity-bitexact.sh --compat=windows
          --dir "$RUNNER_TEMP/reference-3596e99" 3596e99
      - name: Every case
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-parity-bitexact
          path: target/windows-parity-bitexact*.tsv
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    # Advisories appear without anything in this repository changing, so a red run here means
    # "look at this", not "your commit is broken".
    continue-on-error: true
    # audit-check reports through a check run, which the read-only default above cannot create.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
      # A commit rather than a tag: v2 and v2.0.0 still declare Node 20, and the move to Node 24
      # (#48) is not in a release yet. Against v2.0.0 that commit changes action.yml's runtime
      # line, package.json's engine and the docs, and not dist/index.js — the same audit, run by
      # the runtime GitHub keeps. Back to a tag once one carries it.
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # v2.0.0 + Node 24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
