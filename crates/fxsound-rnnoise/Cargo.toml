[package]
name = "fxsound-rnnoise"
version.workspace = true
edition = "2024"
rust-version.workspace = true
# BSD-3-Clause, not the workspace's AGPL: this is Joe Neeman's `nnnoiseless` 0.5.2 (itself a port
# of Xiph's RNNoise), vendored with its `COPYING` and `AUTHORS`. See README.md for what was
# changed and why; every change is marked `// fxsound:` in the source.
license = "BSD-3-Clause"
repository.workspace = true
description = "RNNoise as a pure-Rust port (vendored nnnoiseless 0.5.2), with an in-place reset and a split analysis/synthesis path"

[lib]
bench = false

[dependencies]
# nnnoiseless 0.5.2 depended on `easyfft` and `once_cell`. `easyfft` is gone from the library: it
# planned the FFT and kept its buffers in a per-thread cache, so the first frame denoised on the
# audio thread allocated there. `realfft`, which `easyfft` wraps, is used directly instead, with
# each state planning its own transforms when it is built (`src/fft.rs`). `once_cell` still holds
# the window and DCT tables, which every constructor now builds before real time starts.
realfft = { workspace = true }
once_cell = "1.9.0"

[dev-dependencies]
# Only so that a test can hold `src/fft.rs` to the transform upstream computed, bit for bit.
easyfft = "0.4.1"
