# FxSound for Linux: smooth moves in WirePlumber (fxsound/fade-on-move.lua).
#
# Installed by FxSound's Settings ▸ Experimental ▸ "Smooth moves in WirePlumber", and taken away
# again by unticking it. By hand: delete this file and
# ~/.local/share/wireplumber/scripts/fxsound/fade-on-move.lua, and restart WirePlumber.
#
# The script is an optional feature that a feature every profile has wants: a script that is
# missing, or that fails on a WirePlumber that changed, is logged and skipped, and never stops
# WirePlumber, as a required one would. It needs WirePlumber's linking hooks, so a profile that
# links nothing leaves it out.
wireplumber.components = [
  {
    type = virtual, provides = custom.fxsound
    wants = [ custom.fxsound.fade-on-move ]
  }
  {
    name = fxsound/fade-on-move.lua, type = script/lua
    provides = custom.fxsound.fade-on-move
    requires = [ hooks.linking.target.link ]
  }
]

wireplumber.profiles = {
  base = {
    custom.fxsound = required
  }
}
