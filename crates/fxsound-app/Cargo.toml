[package]
name = "fxsound-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop integration for the FxSound Linux port: command line, single-instance IPC, StatusNotifierItem tray and desktop notifications"

[lib]
name = "fxsound_app"
path = "src/lib.rs"

[[bin]]
name = "fxsound"
path = "src/main.rs"

[dependencies]
fxsound-core = { workspace = true }
fxsound-ui = { workspace = true }
fxsound-dsp = { workspace = true }
fxsound-preset = { workspace = true }
fxsound-audio = { workspace = true }
eframe = { workspace = true }
rfd = { workspace = true }
anyhow = { workspace = true }
env_logger = { workspace = true }
clap = { workspace = true }
crossbeam-channel = { workspace = true }
signal-hook = { workspace = true }
# `blocking` is additive on top of the workspace's default (`tokio`) feature and gives us
# `ksni::blocking::Handle::update`, which is synchronous — the egui thread must never await
# (`docs/api/linux-desktop-crates.md` §2.9).
ksni = { workspace = true, features = ["blocking"] }
notify-rust = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `--self-test` parses the settings file itself: `Settings::load` moves a file it cannot parse
# aside, and a self-test must not write anything.
toml = { workspace = true }
dirs = { workspace = true }
log = { workspace = true }
# Two runtimes, never one: ksni's tray service runs on a private current-thread runtime of its own
# (`docs/api/linux-desktop-crates.md` §1), and the D-Bus service (`src/dbus.rs`) builds another
# on its `fxsound-dbus` thread. `net` and `time` are that runtime's drivers — zbus's socket is a
# tokio `UnixStream` there, and a method call waits for the GUI thread under a timeout — and
# `sync` is the oneshot the answer comes back on. zbus asks for all three itself; naming them
# here keeps the build from depending on that.
tokio = { workspace = true, features = ["net", "sync", "time"] }
# The D-Bus service. Already in the tree through ksni and notify-rust, with `tokio` and `async-io`
# both on; `tokio` is named so the service does not depend on that unification, and
# `blocking-api` for `zbus::blocking`, which nothing else enables (the tests call the service
# through a blocking proxy).
zbus = { workspace = true, features = ["tokio", "blocking-api"] }

[dev-dependencies]
tempfile = { workspace = true }
